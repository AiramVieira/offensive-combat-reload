# Offensive Combat behind nginx (Docker): static files straight from nginx, /ws proxied to the game server.
# Same rules as offensive-combat.conf, with the paths of the Docker images.

limit_conn_zone $binary_remote_addr zone=oc_conn:10m;
limit_req_zone $binary_remote_addr zone=oc_req:10m rate=40r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream oc_game {
    server jogo:8787;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm model/gltf-binary image/svg+xml;

    # Game WebSocket: long-lived, unbuffered, a few connections per IP at most.
    location = /ws {
        proxy_pass http://oc_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        limit_conn oc_conn 6;
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        limit_req zone=oc_req burst=80 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        expires 1h;
    }

    location ~* \.ktx2$ {
        types { }
        default_type image/ktx2;
        expires 1h;
    }

    # The page itself is always revalidated, so a new build reaches everyone on reload.
    location / {
        limit_req zone=oc_req burst=80 nodelay;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
