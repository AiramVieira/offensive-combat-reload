# Offensive Combat behind nginx, without Docker (Linux server; also works with nginx for Windows after
# adjusting `root`). The game server runs on the same machine with HOST=127.0.0.1 PORT=8787
# (see deploy/offensive-combat.service); nginx is the only thing exposed to the internet.
#
# Install:  sudo cp deploy/nginx/offensive-combat.conf /etc/nginx/conf.d/
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d jogo.seudominio.com   (fills in the ssl_* lines below)

limit_conn_zone $binary_remote_addr zone=oc_conn:10m;
limit_req_zone $binary_remote_addr zone=oc_req:10m rate=40r/s;
# Sign-in, sign-up and password reset (the game server also limits per IP and per account in Redis).
limit_req_zone $binary_remote_addr zone=oc_auth:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme the player used: a tunnel in front (cloudflared) already says https, otherwise ours.
# The game server marks the session cookie Secure only over https.
map $http_x_forwarded_proto $oc_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream oc_game {
    server 127.0.0.1:8787;
}

server {
    listen 80;
    # listen 443 ssl;                                   # managed by certbot
    # ssl_certificate     /etc/letsencrypt/live/jogo.seudominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jogo.seudominio.com/privkey.pem;
    server_name _;                                      # or jogo.seudominio.com

    # Where `bun run build` put the game (copy the dist/ folder here).
    root /var/www/offensive-combat/dist;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm model/gltf-binary image/svg+xml;

    # Game WebSocket: long-lived, unbuffered, a few connections per IP at most.
    # Over HTTPS the page connects with wss:// automatically.
    location = /ws {
        proxy_pass http://oc_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $oc_proto;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        limit_conn oc_conn 6;
    }

    # Account API: accounts, sessions (HttpOnly cookie), WebSocket tickets.
    location /api/ {
        proxy_pass http://oc_game;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $oc_proto;
        add_header Cache-Control "no-store" always;
        limit_req zone=oc_req burst=40 nodelay;
    }
    location ~ ^/api/auth/(entrar|cadastro|recuperar|redefinir)$ {
        proxy_pass http://oc_game;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $oc_proto;
        add_header Cache-Control "no-store" always;
        limit_req zone=oc_auth burst=10 nodelay;
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        limit_req zone=oc_req burst=80 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        expires 1h;
    }

    location ~* \.ktx2$ {
        types { }
        default_type image/ktx2;
        expires 1h;
    }

    # The page itself is always revalidated, so a new build reaches everyone on reload.
    location / {
        limit_req zone=oc_req burst=80 nodelay;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
